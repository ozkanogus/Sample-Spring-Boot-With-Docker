spring.application.name=employee-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_service?serverTimezone=UTC&characterEncoding=utf-8}
spring.datasource.username=${DB_USERNAME:employee_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.auto-commit=true

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.transaction.rollback-on-commit-failure=true

server.port=${SERVER_PORT:8085}
audit.log.path=${AUDIT_LOG_PATH:/var/log/employee-service}
